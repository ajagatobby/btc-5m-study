# Back-to-back shifts (a job can run at most 6 hours): each records 190 minutes, waits up to 8 for
# its last markets to settle, saves its data and then starts the next shift itself, until the study
# ends (2026-12-02 16:00Z, STUDY_END in record.ts). GitHub's schedule often skips runs on a new
# repo, so the cron only revives the chain if it ever breaks; one shift runs at a time.
name: Record

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: How long to record
        default: "190"

permissions:
  contents: read
  actions: write

concurrency:
  group: record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record
        env:
          STUDY_MINUTES: ${{ inputs.minutes || '190' }}
        run: node --experimental-strip-types --no-warnings record.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc5m-${{ github.run_id }}
          path: data/
          if-no-files-found: ignore
          retention-days: 30
      - name: Start the next shift
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date +%s)" -lt 1796227200 ]; then gh workflow run record.yml -R "$GITHUB_REPOSITORY"; fi
